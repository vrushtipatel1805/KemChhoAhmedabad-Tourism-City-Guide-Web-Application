<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographer Dashboard | Kem Chho Ahmedabad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-color: #ff6b35;
            /* Orange for Photographers */
            --brand-dark: #e55a2b;
            --bg-soft: #fff5f2;
            --text-main: #2d3436;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-soft);
            color: var(--text-main);
            min-height: 100vh;
        }

        .navbar {
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .navbar-brand {
            font-weight: 700;
            color: var(--brand-color) !important;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            background: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--brand-dark);
            border: 1px solid #ffeaa7;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge.active {
            background: #e6fffa;
            color: #00b894;
            border-color: #55efc4;
        }

        .container {
            max-width: 800px;
            margin-top: 30px;
        }

        .section-title {
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-custom {
            background: white;
            border: none;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
            transition: transform 0.3s;
        }

        .card-custom:hover {
            transform: translateY(-5px);
        }

        .request-card {
            border-left: 5px solid var(--brand-color);
        }

        .active-card {
            border-left: 5px solid #00b894;
            background: #f0fff4;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            border: none;
            transition: 0.3s;
        }

        .btn-accept {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
        }

        .btn-accept:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 184, 148, 0.3);
        }

        .btn-reject {
            background: #fff;
            border: 2px solid #ff7675;
            color: #ff7675;
        }

        .btn-reject:hover {
            background: #ff7675;
            color: white;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .detail-label {
            color: #636e72;
            font-weight: 500;
        }

        .detail-value {
            font-weight: 600;
            color: var(--text-main);
            text-align: right;
        }

        .loader {
            display: none;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#">
                <i class="fas fa-camera-retro fa-lg"></i> {{ photographer.username }}
            </a>
            <div class="d-flex align-items-center gap-3">
                <div class="status-badge {{ 'active' if photographer.is_available else '' }}">
                    <i class="fas fa-circle" style="font-size: 8px;"></i>
                    {{ 'Available' if photographer.is_available else 'Busy' }}
                </div>
                <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-danger rounded-pill px-3">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 80px;">

        <!-- Active Job Section -->
        <div id="active-job-section" style="display: none;">
            <div class="section-title text-success">
                <span><i class="fas fa-bolt me-2"></i> Current Assignment</span>
            </div>
            <div class="card-custom active-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold m-0" id="active-loc">Location</h5>
                    <span class="badge bg-success">CONFIRMED</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-user me-2"></i>Client</span>
                    <span class="detail-value" id="active-client">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-rupee-sign me-2"></i>Price</span>
                    <span class="detail-value text-success" id="active-price">₹--</span>
                </div>
                <div class="mt-4">
                    <button class="btn-action btn-accept" onclick="completeJob()"><i
                            class="fas fa-check-circle me-2"></i> Mark Completed</button>
                </div>
            </div>
        </div>

        <!-- New Requests Section -->
        <div class="section-title">
            <span><i class="fas fa-list-ul me-2"></i> New Requests</span>
            <button class="btn btn-sm btn-light rounded-pill shadow-sm" onclick="fetchRequests()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>

        <div id="loader" class="loader"><i class="fas fa-spinner fa-spin fa-2x text-muted"></i></div>
        <div id="requests-container">
            <!-- Requests injected here -->
            <div class="text-center text-muted py-5">
                <i class="far fa-folder-open fa-3x mb-3 opacity-25"></i>
                <p>No new requests available.</p>
            </div>
        </div>

    </div>

    <script>
        let currentActiveId = null;

        function fetchRequests() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('requests-container').style.opacity = '0.5';

            // 1. Check Active Job
            fetch('/api/photographer/active')
                .then(res => res.json())
                .then(data => {
                    const activeSection = document.getElementById('active-job-section');
                    if (data) {
                        activeSection.style.display = 'block';
                        document.getElementById('active-loc').innerText = data.location;
                        document.getElementById('active-client').innerText = data.customer;
                        document.getElementById('active-price').innerText = '₹' + data.price;
                        currentActiveId = data.id;
                    } else {
                        activeSection.style.display = 'none';
                        currentActiveId = null;
                    }
                });

            // 2. Fetch Pending Requests
            fetch('/api/photographer/requests')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('requests-container');
                    container.innerHTML = '';
                    document.getElementById('loader').style.display = 'none';
                    container.style.opacity = '1';

                    if (data.length === 0) {
                        container.innerHTML = `
                            <div class="text-center text-muted py-5">
                                <i class="far fa-folder-open fa-3x mb-3 opacity-25"></i>
                                <p>No new requests available.</p>
                            </div>`;
                        return;
                    }

                    data.forEach(req => {
                        const card = document.createElement('div');
                        card.className = 'card-custom request-card fade-in';
                        card.innerHTML = `
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="fw-bold m-0">${req.location}</h5>
                                <span class="badge bg-warning text-dark">PENDING</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label"><i class="fas fa-user me-2"></i>Client</span>
                                <span class="detail-value">${req.customer}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label"><i class="fas fa-calendar me-2"></i>Date</span>
                                <span class="detail-value">${req.date}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label"><i class="fas fa-rupee-sign me-2"></i>Payment</span>
                                <span class="detail-value text-success fw-bold">₹${req.price}</span>
                            </div>
                            <div class="row mt-4 g-2">
                                <div class="col-6">
                                    <button class="btn-action btn-reject" onclick="updateStatus(${req.id}, 'reject')">Decline</button>
                                </div>
                                <div class="col-6">
                                    <button class="btn-action btn-accept" onclick="updateStatus(${req.id}, 'accept')">Accept</button>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                });
        }

        function updateStatus(id, action) {
            if (!confirm(`Are you sure you want to ${action} this request?`)) return;

            fetch('/api/photographer/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ shoot_id: id, action: action })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.error) alert(data.error);
                    else fetchRequests();
                });
        }

        function completeJob() {
            if (!currentActiveId) return;
            updateStatus(currentActiveId, 'complete');
        }

        // Auto Refresh
        setInterval(fetchRequests, 10000); // 10s polling
        window.onload = fetchRequests;
    </script>
</body>

</html>
