<!-- login1.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login | Kem Chho Ahmedabad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #005870 0%, #003e4e 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border-radius: 30px;
            padding: 50px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .btn-login {
            background: #005870;
            color: white;
            border-radius: 50px;
            padding: 12px;
            width: 100%;
            border: none;
            font-weight: 600;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #008c9e;
            transform: translateY(-2px);
        }

        .btn-role {
            border: 1px solid #005870;
            color: #005870;
            font-weight: 500;
            border-radius: 20px;
            padding: 5px 15px;
            transition: 0.3s;
        }

        .btn-role:hover {
            background-color: #f0f8fa;
            color: #005870;
        }

        .btn-check:checked+.btn-role {
            background-color: #005870;
            color: white;
            border-color: #005870;
            box-shadow: 0 4px 10px rgba(0, 88, 112, 0.3);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h2 class="fw-bold mb-2" style="color:#005870">Welcome Back</h2>
        <p class="text-muted mb-4">Please log in to your portal</p>

        <form method="POST" action="{{ url_for('login') }}" id="loginForm">
            <div class="mb-4 d-flex justify-content-center gap-2">
                <input type="radio" class="btn-check" name="role" id="roleCustomer" value="user" checked
                    onchange="updateAction()">
                <label class="btn btn-role btn-sm" for="roleCustomer">User</label>

                <input type="radio" class="btn-check" name="role" id="roleDriver" value="driver"
                    onchange="updateAction()">
                <label class="btn btn-role btn-sm" for="roleDriver">Driver</label>

                <input type="radio" class="btn-check" name="role" id="rolePhotographer" value="photographer"
                    onchange="updateAction()">
                <label class="btn btn-role btn-sm" for="rolePhotographer">Photographer</label>

                <input type="radio" class="btn-check" name="role" id="roleAdmin" value="admin"
                    onchange="updateAction()">
                <label class="btn btn-role btn-sm" for="roleAdmin">Admin</label>
            </div>

            <input type="text" name="username" id="usernameField" class="form-control mb-3" placeholder="Email Address"
                required style="border-radius:12px; padding:12px;">
            <input type="password" name="password" class="form-control mb-3" placeholder="Password" required
                style="border-radius:12px; padding:12px;">

            <button type="submit" class="btn btn-login">Login to Portal</button>
        </form>

        <script>
            function updateAction() {
                const role = document.querySelector('input[name="role"]:checked').value;
                const form = document.getElementById('loginForm');
                const userField = document.getElementById('usernameField');

                if (role === 'photographer') {
                    // form.action = "{{ url_for('photographer_login') }}"; // Use unified login
                    userField.name = 'username';
                    userField.placeholder = 'Username';
                } else {
                    // form.action = "{{ url_for('login') }}";
                    userField.name = 'email';
                    userField.placeholder = 'Email Address';
                }
            }
            window.onload = updateAction;
        </script>

        <div class="mt-4">
            <small>New to the experience? <a href="{{ url_for('signup') }}" style="color:#005870; font-weight:600;">Sign
                    up now</a></small>
        </div>
    </div>
</body>

</html>
