<!-- signup1.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Account | Kem Chho Ahmedabad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #005870 0%, #003e4e 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 45px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 20px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #008c9e;
            box-shadow: 0 0 0 4px rgba(0, 140, 158, 0.1);
        }

        .role-badge {
            background: #f0f7f9;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #e1eef2;
        }

        .btn-premium {
            background: linear-gradient(45deg, #005870, #008c9e);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 14px;
            font-weight: 600;
            width: 100%;
            transition: 0.4s;
            box-shadow: 0 10px 20px rgba(0, 88, 112, 0.2);
        }

        .btn-premium:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(0, 88, 112, 0.3);
            color: white;
        }

        #driver-fields {
            display: none;
            padding: 20px;
            background: #fafafa;
            border-radius: 15px;
            margin-top: 15px;
            border-left: 4px solid #008c9e;
        }

        .btn-role {
            border: 1px solid #005870;
            color: #005870;
            font-weight: 500;
            border-radius: 25px;
            padding: 10px 20px;
            transition: 0.3s;
            background: white;
            margin: 0 5px;
        }

        .btn-role:hover {
            background-color: #f0f8fa;
            color: #005870;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 88, 112, 0.1);
        }

        .btn-check:checked+.btn-role {
            background: linear-gradient(135deg, #005870 0%, #008c9e 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(0, 88, 112, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="signup-card">
        <div class="text-center mb-4">
            <h2 style="color:#005870; font-weight:700;">Join the Experience</h2>
            <p class="text-muted">Register for Ahmedabad's premium concierge</p>
        </div>
        <form method="POST">
            <div class="role-badge" style="background: transparent; border: none; padding: 0;">
                <label class="small text-uppercase fw-bold text-muted mb-3 d-block text-center">Select Your Role</label>
                <div class="d-flex justify-content-center flex-wrap" role="group">
                    <input type="radio" class="btn-check" name="role" id="roleCustomer" value="user" checked
                        onclick="toggleFields()">
                    <label class="btn btn-role mb-2" for="roleCustomer">User</label>

                    <input type="radio" class="btn-check" name="role" id="roleDriver" value="driver"
                        onclick="toggleFields()">
                    <label class="btn btn-role mb-2" for="roleDriver">Driver</label>

                    <input type="radio" class="btn-check" name="role" id="rolePhotographer" value="photographer"
                        onclick="toggleFields()">
                    <label class="btn btn-role mb-2" for="rolePhotographer">Photo</label>

                    <input type="radio" class="btn-check" name="role" id="roleAdmin" value="admin"
                        onclick="toggleFields()">
                    <label class="btn btn-role mb-2" for="roleAdmin">Admin</label>
                </div>
            </div>
            <input type="text" name="username" class="form-control" placeholder="Full Name" required>
            <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            <input type="password" name="password" class="form-control" placeholder="Create Password" required>
            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>

            <input type="text" name="phone" class="form-control" placeholder="Phone Number" required>

            <div id="driver-fields">
                <h6 class="mb-3 text-dark fw-bold">Vehicle Information</h6>
                <input type="text" name="car_model" class="form-control" placeholder="Car Model (e.g. Audi A6, Innova)">
                <input type="text" name="car_number" class="form-control" placeholder="Registration Number">
            </div>

            <button type="submit" class="btn btn-premium mt-4">Create My Account</button>
            <div class="text-center mt-3"><small>Already have an account? <a href="{{ url_for('login') }}"
                        style="color:#005870; font-weight:600;">Login here</a></small></div>
        </form>
    </div>
    <script>
        function toggleFields() {
            const role = document.querySelector('input[name="role"]:checked').value;
            // Only show driver fields if role is 'driver'
            document.getElementById('driver-fields').style.display = (role === 'driver') ? 'block' : 'none';
        }
    </script>
</body>

</html>
